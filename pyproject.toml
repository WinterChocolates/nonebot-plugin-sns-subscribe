[project]
name = "nonebot-plugin-sns-subscribe"
version = "0.1.0"
description = "B站 / 抖音动态、视频与直播订阅推送插件 for NoneBot2，支持 Web 后台在线编辑卡片模板"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "WinterChocolates", email = "WinterChocolates@users.noreply.github.com" }]
dependencies = [
  "aiosqlite>=0.20.0,<1.0.0",
  "httpx>=0.28.0,<1.0.0",
  "jinja2>=3.1.4,<4.0.0",
  "nonebot-adapter-onebot>=2.4.6,<3.0.0",
  "nonebot2[fastapi]>=2.5.0,<3.0.0",
  "pillow>=9.1.0",
  "playwright>=1.45.0",
  "python-multipart>=0.0.9",
  "qrcode>=7.4",
  "regex>=2024.5.15",
]

[project.entry-points."nonebot.plugin"]
nonebot-plugin-sns-subscribe = "nonebot_plugin_sns_subscribe"

[project.urls]
Homepage = "https://github.com/WinterChocolates/nonebot_plugin_sns_subscribe"
Issues = "https://github.com/WinterChocolates/nonebot_plugin_sns_subscribe/issues"
Repository = "https://github.com/WinterChocolates/nonebot_plugin_sns_subscribe.git"

[dependency-groups]
dev = [
  "bump-my-version>=1.2.7",
  "nonebot2[fastapi]>=2.5.0,<3.0.0",
  "poethepoet>=0.30.0,<1.0.0",
  "ruff>=0.9.0,<1.0.0",
  { include-group = "test" },
]
test = [
  "nonebot-adapter-onebot>=2.4.6,<3.0.0",
  "nonebot2[fastapi]>=2.5.0,<3.0.0",
  "nonebug>=0.4.4,<1.0.0",
  "poethepoet>=0.30.0,<1.0.0",
  "pytest>=8.0.0,<10.0.0",
  "pytest-asyncio>=0.24.0,<2.0.0",
  "pytest-cov>=6.0.0,<8.0.0",
  "pytest-xdist>=3.8.0,<4.0.0",
]

[build-system]
requires = ["uv_build>=0.9.0,<1.0.0"]
build-backend = "uv_build"

[tool.bumpversion]
current_version = "0.1.0"
commit = true
message = "release: bump vesion from {current_version} to {new_version}"
tag = true

[[tool.bumpversion.files]]
filename = "uv.lock"
search = "name = \"nonebot-plugin-sns-subscribe\"\nversion = \"{current_version}\""
replace = "name = \"nonebot-plugin-sns-subscribe\"\nversion = \"{new_version}\""

[tool.coverage.report]
exclude_lines = [
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "@overload",
  "except ImportError:",
]

[tool.nonebot]
plugin_dirs = []
builtin_plugins = []

[tool.nonebot.plugins]
"@local" = ["nonebot_plugin_sns_subscribe"]

[tool.nonebot.adapters]
"@local" = []
"nonebot-adapter-onebot" = [
  { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" },
]

[tool.poe.tasks]
test = "pytest --cov=src --cov-report xml --junitxml=./junit.xml -n auto"
bump = "bump-my-version bump"
show-bump = "bump-my-version show-bump"

[tool.pyright]
pythonVersion = "3.10"
pythonPlatform = "All"
defineConstant = { PYDANTIC_V2 = true }
executionEnvironments = [
  { root = "./tests", extraPaths = [
    "./src",
  ] },
  { root = "./src" },
]
typeCheckingMode = "standard"
disableBytesTypePromotions = true

[tool.pytest.ini_options]
addopts = [
  "--import-mode=prepend", # 导入模式
  "--strict-markers",      # 严格标记模式
  "--tb=short",            # 简短的错误回溯
  "-ra",                   # 显示所有测试结果摘要
  "-s",                    # 显示打印信息
  "-v",                    # 详细输出
]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.ruff]
line-length = 88

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
  "F",     # Pyflakes
  "W",     # pycodestyle warnings
  "E",     # pycodestyle errors
  "I",     # isort
  "UP",    # pyupgrade
  "ASYNC", # flake8-async
  "C4",    # flake8-comprehensions
  "T10",   # flake8-debugger
  "T20",   # flake8-print
  "PYI",   # flake8-pyi
  "PT",    # flake8-pytest-style
  "Q",     # flake8-quotes
  "TID",   # flake8-tidy-imports
  "RUF",   # Ruff-specific rules
]
ignore = [
  "E402",   # module-import-not-at-top-of-file
  "UP037",  # quoted-annotation
  "RUF001", # ambiguous-unicode-character-string
  "RUF002", # ambiguous-unicode-character-docstring
  "RUF003", # ambiguous-unicode-character-comment
  "W191",   # indentation contains tabs
  "TID252", # relative-import
]

[tool.ruff.lint.isort]
length-sort = true
known-first-party = ["tests/*"]
extra-standard-library = ["typing_extensions"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.uv.build-backend]
module-root = "src"
